[package]
name = "limenora-sdk"
version = "2.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Apache-2.0 SDK for the LIMENORA Enterprise Agent Integration Gateway"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

